name: Browser release QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Run full clinical flow in Chromium and WebKit
        run: |
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/ratoncito-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ratoncito-clinical/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/release-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: qa-results/
